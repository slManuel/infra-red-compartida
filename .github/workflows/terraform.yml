name: Planificar y aplicar infraestructura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-red
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKSPACE: default
  TF_VAR_aws_account_id: "022907376152"
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_PAGER: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  deploy:
    needs: checks
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::022907376152:role/prueba-devops-github-actions-red
          aws-region: us-east-1
          allowed-account-ids: "022907376152"
          role-session-name: red-${{ github.run_id }}
      - name: Inicializar y validar
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate
      - name: Planificar y comprobar alcance
        shell: bash
        run: |
          umask 077
          set -o pipefail
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -out=infra.tfplan 2>&1 | tee plan.log
          codes=("${PIPESTATUS[@]}")
          set -e
          echo "Terraform exit code: ${codes[0]}; tee exit code: ${codes[1]}"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          if [ "${codes[1]}" -ne 0 ]; then exit "${codes[1]}"; fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          plan = json.loads(subprocess.check_output(["terraform", "show", "-json", "infra.tfplan"], text=True))
          expected = set(json.loads(Path(".github/recursos-autorizados.json").read_text()))
          counts = {"create": 0, "no-op": 0}
          for change in plan.get("resource_changes", []):
              if change.get("mode") == "data":
                  continue
              address = change["address"]
              actions = change["change"]["actions"]
              if address not in expected or actions not in (["create"], ["no-op"]):
                  raise SystemExit("Cambio fuera del alcance inicial autorizado: " + address + " " + str(actions))
              counts[actions[0]] += 1
              print(address + ": " + actions[0])
          if sum(counts.values()) != len(expected):
              raise SystemExit("El plan no cubre los recursos autorizados.")
          text = "Plan verificado: " + str(counts["create"]) + " creaciones, 0 cambios, 0 eliminaciones."
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text + "\n")
          PY
      - name: Guardar plan privado para revisión
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra.tfplan
            plan.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Comprobar main antes de aplicar
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"
      - name: Aplicar el mismo plan guardado
        shell: bash
        run: |
          umask 077
          set -o pipefail
          set +e
          terraform apply -no-color -input=false -lock-timeout=5m infra.tfplan 2>&1 | tee apply.log
          codes=("${PIPESTATUS[@]}")
          set -e
          echo "Terraform exit code: ${codes[0]}; tee exit code: ${codes[1]}"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          if [ "${codes[1]}" -ne 0 ]; then exit "${codes[1]}"; fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          content = Path("apply.log").read_text()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for text in re.findall(r"Apply complete! Resources: [^\n]+", content):
                  summary.write(text + "\n")
          PY
      - name: Guardar diagnóstico privado de apply
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apply.log
            errored.tfstate
          if-no-files-found: ignore
          retention-days: 1
